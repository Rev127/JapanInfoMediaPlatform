{% extends 'wrapper.html' %}
{% load static %}
{% block head_custom_styles %}
<link rel="stylesheet" href="{% static 'user/scss/profile_style.scss' %}" type="text/x-scss">
{% endblock %}
{% block body %}
<div class="container">
    <!-- User Profile -->
    <div class="profile">
        <div class="avatar">
            <!--{% if user.avatar %}-->
            <img src="" alt="Avatar">
            <!--{% else %}-->
            <img src="/media/user_avatar/user_icon.png" alt="Avatar">
            <!--{% endif %}-->
        </div>
        <div class="user-info">
            <h2></h2>
            <p></p>
            <form action="" method="post">
                {% csrf_token %}
                <button class="logout-button">Log Out</button>
            </form>
        </div>
    </div>

    <!-- Update Profile Information -->
    <form method="POST" enctype="multipart/form-data" class="update-form" action="">
        {% csrf_token %}

        <!-- Username Update -->
        <div class="form-group">
            <input type="text" name="username" placeholder="Update Username" value="">
            <button type="submit" name="action" value="username_update">Username Update</button>
        </div>

        <!-- Email Update -->
        <div class="form-group">
            <input type="email" name="email" placeholder="Update Email" value="">
            <button type="submit" name="action" value="email_update">Email Update</button>
        </div>

        <!-- Avatar Selection -->
        <div class="form-group file-group">
            <!-- input for file selection -->
            <input type="file" name="avatar" accept="image/*" class="file-input">
            <!-- button for avatar update -->
            <button type="submit" name="action" value="avatar_update" class="file-upload-btn">Avatar Update</button>
        </div>
    </form>

</div>
<div class="container">
    <!-- Liked Novels -->
    <div class="liked-novels">
        <h2>Відстежуванні роботи</h2>
        <section class="section">
            <div class="cards">

                <div class="card">
                    <div class="thumbnail">
                        <!--{% if novel.image %}-->
                        <img src="" alt="" style="width: 100%; height: 100%;">
                        <!--{% else %}-->
                        <div class="placeholder">No Image</div>
                        <!--{% endif %}-->
                    </div>
                    <div class="novel-title-wrapper">
                        <p class="novel-title"><a href=""></a></p>
                    </div>
                </div>
            </div>
        </section>
    </div>
</div>

{% endblock %}
