<div class="jim-platform"><a href="{% url 'index' %}">JIMP</a></div>
<div class="nav-bar">
    <div class="nav-item">
        <a href="{% url 'index' %}">Головна</a>
    </div>
    <div class="nav-item">
        <a href="#about_us">Про нас</a>
    </div>
</div>
    <div class="search-bar">
      <form method="get" action="{% url 'search' %}">
        <input type="text" id="search-input" name="q" placeholder="Пошук" class="search-input" autocomplete="off">
        <button type="submit" class="search-button">Пошук</button>
      </form>
      <ul id="suggestions" class="suggestions-list"></ul>
    </div>
    {% if user.is_authenticated %}
    <div class="mini-user-info">
        <a href="{% url 'profile' %}">{{ user.username }}</a>
        {% if user.avatar %}
        <img src="{{ user.get_avatar }}" alt="Avatar" class="user-icon"/>
        {% else %}
        <img src="/media/user_avatar/user_icon.png" alt="Avatar" class="user-icon"/>
        {% endif %}
    </div>
    {% else %}
    <div class="auth">
        <button class="button default" onclick="window.location.href='{% url 'login' %}'">
            <span class="text">Sign in</span>
        </button>
    </div>
    {% endif %}
